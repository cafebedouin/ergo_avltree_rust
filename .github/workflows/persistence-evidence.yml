name: persistence-evidence
on: pull_request
permissions:
  contents: read
jobs:
  feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: feature suite
        run: cargo test --features disk-persistence --no-fail-fast --lib --tests -- --nocapture
      - name: differential oracle and isolation (separate step, always runs)
        if: always()
        run: cargo test --features disk-persistence --test persistence_oracle --test persistence_isolation -- --nocapture
